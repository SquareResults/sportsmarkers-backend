[project]
name = "sportsmarkers-backend"
version = "0.1.0"
description = "Backend API for the SportsMarkers athlete portfolio platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dj-database-url>=3.0,<4",
    "django>=5.2,<6",
    "django-cors-headers>=4.7,<5",
    "django-filter>=25.1,<26",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.28,<1",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3,<4",
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
