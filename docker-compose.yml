services:
  api:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sportsmarkers
      POSTGRES_USER: sportsmarkers
      POSTGRES_PASSWORD: sportsmarkers
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsmarkers -d sportsmarkers"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
